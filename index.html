<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그해, 3학년 3반</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f5f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    /* --- 1. 비밀번호 게이트 화면 --- */
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }
    .login-box {
      background: #fff;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .login-box h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #222;
    }
    .login-box p {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .login-box input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }
    .login-box input:focus {
      border-color: #4A90E2;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #4A90E2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #357ABD;
    }
    #error-msg {
      color: #e74c3c;
      font-size: 0.8rem;
      margin-top: 10px;
      display: none;
    }

    /* --- 메인 컨텐츠 영역 --- */
    .container {
      width: 100%;
      max-width: 680px;
      display: none;
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      font-size: 1.8rem;
      color: #111;
      margin-bottom: 6px;
    }
    header p {
      font-size: 0.9rem;
      color: #777;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      padding: 20px;
      margin-bottom: 25px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* --- 2. 비디오 플레이어 --- */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* --- 3. 사진 갤러리 슬라이드 --- */
    .gallery-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px;
    }
    .gallery-container::-webkit-scrollbar {
      height: 6px;
    }
    .gallery-container::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }
    .gallery-item {
      flex: 0 0 80%;
      scroll-snap-align: center;
      border-radius: 12px;
      overflow: hidden;
      background: #eee;
      aspect-ratio: 4 / 3;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- 4. 댓글/방명록 --- */
    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .comment-inputs {
      display: flex;
      gap: 10px;
    }
    .comment-inputs input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .comment-form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      resize: none;
      height: 60px;
      outline: none;
    }
    .comment-form button {
      align-self: flex-end;
      padding: 8px 18px;
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comment-item {
      background: #f8f9fa;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 0.88rem;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .comment-author {
      font-weight: bold;
      color: #333;
    }
    .comment-date {
      font-size: 0.75rem;
      color: #999;
    }
    .comment-text {
      color: #555;
      line-height: 1.4;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 10px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>🔒 우리반 입장 비밀번호</h2>
      <p>책자 마지막 장에 표기된<br>우리반 전용 비밀번호를 입력해주세요.</p>
      <input type="password" id="password-input" placeholder="비밀번호 입력">
      <button onclick="checkPassword()">입장하기</button>
      <div id="error-msg">비밀번호가 올바르지 않습니다. 다시 확인해 주세요!</div>
    </div>
  </div>

  <div class="container" id="main-content">
    
    <header>
      <h1> 그해, 3학년 3반</h1>
      <p>우리들의 이야기가 담긴 공간에 오신 것을 환영합니다!</p>
    </header>

    <div class="card">
      <div class="card-title">🎬 학급 추억 영상</div>
      <div class="video-wrapper">
        <video controls poster="thumbnail.jpg">
          <source src="1.mp4" type="video/mp4">
          브라우저가 비디오 재생을 지원하지 않습니다.
        </video>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📸 우리가 함께였던 순간들</div>
      <div class="gallery-container">
        <div class="gallery-item"><img src="1.jpg" alt="추억 사진 1"></div>
        <div class="gallery-item"><img src="2.jpg" alt="추억 사진 2"></div>
        <div class="gallery-item"><img src="photo3.jpg" alt="추억 사진 3"></div>
        <div class="gallery-item"><img src="photo4.jpg" alt="추억 사진 4"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">💬 댓글/방명록</div>
      
      <div class="comment-form">
        <div class="comment-inputs">
          <input type="text" id="author-name" placeholder="이름을 적어주세요! ">
        </div>
        <textarea id="comment-text" placeholder="친구들과 선생님께 남기고 싶은 한마디를 적어주세요!"></textarea>
        <button onclick="addComment()">등록하기</button>
      </div>

      <div class="comment-list" id="comment-list"></div>
    </div>

    <footer>
      &copy; 2026 우리반 학급 책자 프로젝트 | All rights reserved.
    </footer>

  </div>

  <script>
    // === 비밀번호 설정 ===
    const VALID_PASSWORDS = ['2026']; 

    function checkPassword() {
      const input = document.getElementById('password-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      const overlay = document.getElementById('login-overlay');
      const mainContent = document.getElementById('main-content');

      if (VALID_PASSWORDS.includes(input)) {
        overlay.style.display = 'none';
        mainContent.style.display = 'block';
      } else {
        errorMsg.style.display = 'block';
      }
    }

    document.getElementById('password-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });

   // === 댓글 및 관리 기능 ===
    // 관리자 전용 비밀번호 (원하시는 비밀번호로 변경해서 사용하세요!)
    const ADMIN_PASSWORD = 'dlgusdn'; 

    window.onload = function() {
      loadComments();
    };

    // 댓글 추가 기능
    function addComment() {
      const nameInput = document.getElementById('author-name');
      const textInput = document.getElementById('comment-text');
      
      const author = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!author || !text) {
        alert('이름과 한마디 내용을 모두 입력해주세요!');
        return;
      }

      const newComment = {
        id: Date.now(),
        author: author,
        text: text,
        date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        likes: 0,
        pinned: false,
        replies: []
      };

      let comments = JSON.parse(localStorage.getItem('class_comments')) || [];
      comments.unshift(newComment);

      saveAndRender(comments);

      nameInput.value = '';
      textInput.value = '';
    }

    // 1인당 1회 제한 좋아요 기능
    function toggleLike(index) {
      let comments = JSON.parse(localStorage.getItem('class_comments')) || [];
      const commentId = comments[index].id;

      // 내가 좋아요를 누른 댓글 ID 목록
      let likedComments = JSON.parse(localStorage.getItem('my_liked_comments')) || [];

      if (likedComments.includes(commentId)) {
        alert('이미 좋아요를 누르셨습니다! ❤️');
        return;
      }

      comments[index].likes = (comments[index].likes || 0) + 1;
      
      likedComments.push(commentId);
      localStorage.setItem('my_liked_comments', JSON.stringify(likedComments));

      saveAndRender(comments);
    }

    // 관리자 비밀번호 입력 후 고정 기능
    function togglePin(index) {
      const inputPw = prompt('관리자 비밀번호를 입력해주세요:');

      if (inputPw === null) return; 

      if (inputPw === ADMIN_PASSWORD) {
        let comments = JSON.parse(localStorage.getItem('class_comments')) || [];
        comments[index].pinned = !comments[index].pinned;
        saveAndRender(comments);
        alert(comments[index].pinned ? '댓글이 상단에 고정되었습니다.' : '고정이 해제되었습니다.');
      } else {
        alert('비밀번호가 올바르지 않습니다! 관리자만 고정 기능을 사용할 수 있습니다.');
      }
    }

    // 답글 입력창 열기/닫기
    function toggleReplyForm(index) {
      const form = document.getElementById(`reply-form-${index}`);
      form.classList.toggle('active');
    }

    // 답글 추가 기능
    function addReply(index) {
      const nameInput = document.getElementById(`reply-author-${index}`);
      const textInput = document.getElementById(`reply-text-${index}`);

      const author = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!author || !text) {
        alert('답글 작성자 이름과 내용을 입력해주세요!');
        return;
      }

      let comments = JSON.parse(localStorage.getItem('class_comments')) || [];
      if (!comments[index].replies) comments[index].replies = [];
      
      comments[index].replies.push({
        author: author,
        text: text,
        date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      });

      saveAndRender(comments);
    }

    // 댓글 삭제 기능
    function deleteComment(index) {
      if (confirm('이 댓글을 삭제하시겠습니까?')) {
        let comments = JSON.parse(localStorage.getItem('class_comments')) || [];
        comments.splice(index, 1);
        saveAndRender(comments);
      }
    }

    // 데이터 저장 및 정렬 후 출력
    function saveAndRender(comments) {
      comments.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      localStorage.setItem('class_comments', JSON.stringify(comments));
      renderComments(comments);
    }

    function loadComments() {
      let comments = JSON.parse(localStorage.getItem('class_comments')) || [];
      renderComments(comments);
    }

    // 댓글 화면에 그리기
    function renderComments(comments) {
      const listContainer = document.getElementById('comment-list');
      let html = '';

      comments.forEach((c, i) => {
        const isPinned = c.pinned ? 'pinned' : '';
        const pinText = c.pinned ? '📌 고정 해제' : '📌 고정';

        let repliesHtml = '';
        if (c.replies && c.replies.length > 0) {
          repliesHtml += '<div class="reply-list">';
          c.replies.forEach(r => {
            repliesHtml += `
              <div class="reply-item">
                <div class="comment-header">
                  <span class="comment-author">↳ ${escapeHtml(r.author)}</span>
                  <span class="comment-date">${r.date}</span>
                </div>
                <div>${escapeHtml(r.text)}</div>
              </div>
            `;
          });
          repliesHtml += '</div>';
        }

        html += `
          <div class="comment-item ${isPinned}">
            ${c.pinned ? '<div class="pin-badge">📌 고정된 댓글</div>' : ''}
            <div class="comment-header">
              <span class="comment-author">${escapeHtml(c.author)}</span>
              <span class="comment-date">${c.date}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
            
            <div class="comment-actions">
              <button class="action-btn" onclick="toggleLike(${i})">❤️ ${c.likes || 0}</button>
              <button class="action-btn" onclick="toggleReplyForm(${i})">💬 답글</button>
              <button class="action-btn" onclick="togglePin(${i})">${pinText}</button>
              <button class="action-btn" onclick="deleteComment(${i})" style="color:#e74c3c;">✕ 삭제</button>
            </div>

            <div class="reply-form" id="reply-form-${i}">
              <input type="text" id="reply-author-${i}" placeholder="이름">
              <textarea id="reply-text-${i}" placeholder="답글을 남겨주세요!"></textarea>
              <button onclick="addReply(${i})">답글 등록</button>
            </div>

            ${repliesHtml}
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
